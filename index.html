<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZNS 23</title>
    <script>
      // Страховка от пустого экрана — работает до загрузки бандла, поэтому написана на старом JS.
      // 1) Telegram мог закэшировать index.html, ссылающийся на бандл, который уже удалён
      //    при деплое (404) — тогда один раз перезагружаемся в обход кэша.
      // 2) Если бандл упал с ошибкой или не запустился за BOOT_TIMEOUT_MS — показываем причину на экране.
      (function () {
        var FLAG = 'zns-asset-reload';
        var BOOT_TIMEOUT_MS = 15000;
        function storage(fn) { try { return fn(window.sessionStorage); } catch (e) { return null; } }

        // Приложение отрисовалось, если в #root есть что-то кроме экрана загрузки
        function appMounted() {
          var root = document.getElementById('root');
          return !!root && root.childNodes.length > 0 && !document.getElementById('boot');
        }

        function showError(text) {
          // React размонтирует дерево после ошибки рендера не сразу — проверяем чуть позже
          setTimeout(function () {
            if (appMounted()) return;
            var root = document.getElementById('root');
            if (!root) return;
            root.innerHTML = '<div id="boot" style="padding:20px;font:14px sans-serif;color:#c33;background:#fff;white-space:pre-wrap;word-break:break-all"></div>';
            root.firstChild.textContent = 'Ошибка запуска приложения:\n' + text +
              '\n\nАдрес: ' + location.origin + location.pathname +
              '\nБраузер: ' + navigator.userAgent;
          }, 100);
        }
        window.__znsShowError = showError;

        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && el !== window && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
            if (!storage(function (s) { return s.getItem(FLAG); })) {
              storage(function (s) { s.setItem(FLAG, '1'); });
              location.replace(location.pathname + '?v=' + Date.now() + location.hash);
            } else {
              showError('не удалось загрузить ' + (el.src || el.href));
            }
            return;
          }
          showError((e.message || 'неизвестная ошибка') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          showError(String(e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });

        window.addEventListener('load', function () {
          // Успешно загрузились — сбрасываем флаг, чтобы при следующем деплое перезагрузка снова сработала
          setTimeout(function () {
            if (appMounted()) storage(function (s) { s.removeItem(FLAG); });
          }, 3000);
        });

        // Ни ошибки, ни отрисовки — бандл не выполнился (например, очень старый WebView)
        setTimeout(function () {
          if (!appMounted()) showError('приложение не запустилось за ' + BOOT_TIMEOUT_MS / 1000 + ' с');
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" crossorigin src="/zns_mgssk_bot/assets/index-DkhaEKY_.js"></script>
    <link rel="stylesheet" crossorigin href="/zns_mgssk_bot/assets/index-B-FnRBxc.css">
  </head>
  <body>
    <!-- Экран загрузки виден сразу, без JS; React заменит его приложением -->
    <div id="root"><div id="boot" style="padding:40px 20px;text-align:center;font:16px sans-serif;color:#555">Загрузка приложения…</div></div>
    <!-- Браузер без поддержки ES-модулей не запустит бандл вообще -->
    <script nomodule>window.__znsShowError('браузер не поддерживает ES-модули — обновите Telegram / Android System WebView');</script>
  </body>
</html>
